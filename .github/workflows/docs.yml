name: docs

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - 'tools/site/**'
      - 'tools/build_docs.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # docs/ is generated and gitignored. It is built here from wiki/ and
      # tools/site/ on every run — there is nothing committed to fall out of
      # date, so there is no staleness check to make.
      - name: Build docs from wiki/
        run: python3 tools/build_docs.py

      - name: Fail if docs/ was not produced
        run: |
          test -f docs/index.md || { echo "docs/index.md missing"; exit 1; }
          test -f docs/.vitepress/config.mts || { echo "config missing"; exit 1; }
          n=$(find docs/reference -name '*.md' | wc -l)
          echo "pages: $n"
          test "$n" -gt 0 || { echo "no reference pages built"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        run: npm ci
        working-directory: docs

      - name: Build
        run: npm run docs:build
        working-directory: docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
