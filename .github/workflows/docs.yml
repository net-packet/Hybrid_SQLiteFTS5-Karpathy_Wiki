name: docs

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - 'docs/**'
      - 'tools/build_docs.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # docs/reference/ is generated from wiki/ — never edit it by hand.
      - name: Sync wiki -> docs/reference
        run: python3 tools/build_docs.py

      - name: Fail if generated docs are stale
        run: |
          if [ -n "$(git status --porcelain docs/reference)" ]; then
            echo "docs/reference is out of date. Run: python3 tools/build_docs.py"
            git status --porcelain docs/reference
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        run: npm ci
        working-directory: docs

      - name: Build
        run: npm run docs:build
        working-directory: docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
